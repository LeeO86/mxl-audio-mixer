[package]
name = "mxl-audio-mixer"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Adrian Hilber <LeeO86@users.noreply.github.com>"]
description = "Broadcast audio engine on MXL"
repository = "https://github.com/LeeO86/mxl-audio-mixer"
publish = false
default-run = "mxl-audio-mixer"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
libc = "0.2"
# Official MXL Rust bindings at the platform pin (release/v1.1 218ddaa). libmxl itself is
# built with -DMXL_ENABLE_FABRICS_OFI=OFF (scripts/build-mxl.sh) and loaded at run time.
mxl = { git = "https://github.com/dmf-mxl/mxl", rev = "218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7", features = ["mxl-not-built"] }
mxl-sys = { git = "https://github.com/dmf-mxl/mxl", rev = "218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7", features = ["mxl-not-built"] }
mxl-nmos = { git = "https://github.com/LeeO86/mxl-nmos", tag = "v0.1.0" }
rtrb = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }

[profile.release]
debug = 1
