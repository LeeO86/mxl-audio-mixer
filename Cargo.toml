[package]
name = "mxl-audio-mixer"
version = "1.5.1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Adrian Hilber <LeeO86@users.noreply.github.com>"]
description = "Broadcast audio engine on MXL"
repository = "https://github.com/LeeO86/mxl-audio-mixer"
publish = false
default-run = "mxl-audio-mixer"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
libc = "0.2"
# Official MXL Rust bindings at the platform pin (release/v1.1 218ddaa). libmxl itself is
# built with -DMXL_ENABLE_FABRICS_OFI=OFF (scripts/build-mxl.sh) and loaded at run time.
mxl = { git = "https://github.com/dmf-mxl/mxl", rev = "218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7", features = ["mxl-not-built"] }
mxl-sys = { git = "https://github.com/dmf-mxl/mxl", rev = "218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7", features = ["mxl-not-built"] }
mxl-nmos = { git = "https://github.com/LeeO86/mxl-nmos", tag = "v0.1.1" }
rtrb = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The path of a parse error, to repair a mix saved by a newer version (D279).
serde_path_to_error = "0.1"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "process"] }
# rustls with the system certificate store, for wss:// peers (rustls and aws-lc-rs
# are already built for reqwest).
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# Token digests for a constant-time compare (already built for axum's WebSocket).
sha1 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }
opus = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Silero VAD (§8.1) on ONNX Runtime (MIT), linked statically; the build fetches
# the prebuilt runtime once per machine (as Com-IS-Assist does). tls-native uses
# the system certificate store, so a TLS-inspecting proxy whose CA is installed
# there can fetch it. Set ORT_LIB_LOCATION to skip the download (see the README).
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-native"] }

[dev-dependencies]
hound = "3.5"
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
# Paused time for the link's deadline tests.
tokio = { version = "1.52", features = ["test-util"] }

[profile.release]
debug = 1
