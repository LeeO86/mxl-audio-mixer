name: publish

# G11: ghcr.io/leeo86/mxl-audio-mixer. On main: git-<sha7> and nightly-dev; on a
# vX.Y.Z tag: X.Y.Z, X.Y and X. Tags are never moved by hand.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tags
        id: tags
        run: |
          set -eu
          image=ghcr.io/leeo86/mxl-audio-mixer
          sha7=$(git rev-parse --short=7 HEAD)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
            [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            # The binary reports the crate version (/api/v1/status, the export).
            crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
            web=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' web/package.json | head -1)
            if [[ "$crate" != "$ver" || "$web" != "$ver" ]]; then
              echo "::error::tag v${ver}, but Cargo.toml is ${crate} and web/package.json is ${web}"
              exit 1
            fi
            echo "list=${image}:${ver},${image}:${ver%.*},${image}:${ver%%.*}" >> "$GITHUB_OUTPUT"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${image}:git-${sha7},${image}:nightly-dev" >> "$GITHUB_OUTPUT"
            echo "version=git-${sha7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/LeeO86/mxl-audio-mixer
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=MIT
            io.dmf.mxl.revision=218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7
