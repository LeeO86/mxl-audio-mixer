name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"
  MXL_REF: 218ddaa0a08c12ffe75fc475ae65aa3d9eef16d7
  # AMWA nmos-testing from source and the nmos-cpp registry through mirror.gcr.io: no Docker Hub.
  NMOS_TESTING_REF: 90018513758e6fbc096c26d7ef001f700b28b510

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LF line endings
        run: |
          if git ls-files -z | xargs -0 grep -lI $'\r' ; then
            echo "::error::files with CRLF line endings"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            spikes/m0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev shellcheck
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
        working-directory: spikes/m0
      - run: shellcheck -x tests/integration/*.sh tests/hw/*/run.sh tests/perf/*.sh scripts/build-mxl.sh scripts/demo.sh ci/amwa.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI build
        run: cd web && npm ci --no-audit --no-fund && npm run build

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      # EBU loudness test set v5 (87 MB, not committed). tech.ebu.ch refuses
      # automated downloads; this GitHub copy is hosted with the EBU's permission and
      # is checked against the official file's SHA-256.
      - name: EBU loudness test set v5
        id: ebu-cache
        uses: actions/cache@v4
        with:
          path: ~/ebu-loudness-test-set
          key: ebu-loudness-test-setv05-9cc500b4df83f7c2
      - if: steps.ebu-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ebu-loudness-test-set && cd ~/ebu-loudness-test-set
          curl -fsSL --retry 3 -o ebu.zip https://github.com/maxwalley/EBULoudnessTestSetV5/releases/download/EBU_Loudness_Test_Set_v5/ebu-loudness-test-setv05.zip
          echo "9cc500b4df83f7c21855c74dce795ef5209a752bf884253ae57d0ce512efb062  ebu.zip" | sha256sum -c
          unzip -q ebu.zip && rm ebu.zip
      - run: EBU_TEST_SET="$HOME/ebu-loudness-test-set" cargo test

  integration:
    name: Integration (libmxl, nmos-cpp registry, AMWA)
    # Release binaries, as in the image: a debug build's DSP thread is an order of
    # magnitude slower, enough to miss deadlines on a shared runner.
    env:
      MIXER_BIN: ${{ github.workspace }}/target/release/mxl-audio-mixer
      TONE_BIN: ${{ github.workspace }}/target/release/mxl-mixer-tone
      PROBE_BIN: ${{ github.workspace }}/target/release/mxl-mixer-probe
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev ninja-build uuid-dev espeak-ng
      - name: Cache libmxl
        id: mxl-cache
        uses: actions/cache@v4
        with:
          path: /opt/mxl
          key: libmxl-${{ env.MXL_REF }}-${{ hashFiles('scripts/build-mxl.sh') }}
      - name: Build libmxl ${{ env.MXL_REF }}
        if: steps.mxl-cache.outputs.cache-hit != 'true'
        run: scripts/build-mxl.sh /opt/mxl
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web UI build (embedded by cargo build)
        run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: cargo build --release --bins
      - name: MediaMTX v1.20.1 (the preview server)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mediamtx.tgz" https://github.com/bluenviron/mediamtx/releases/download/v1.20.1/mediamtx_v1.20.1_linux_amd64.tar.gz
          echo "81b143f55a5d23d4a8c028d52869c14ea4a59919900528698fcc97a747fd69c6  $RUNNER_TEMP/mediamtx.tgz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/mediamtx" && tar xzf "$RUNNER_TEMP/mediamtx.tgz" -C "$RUNNER_TEMP/mediamtx" mediamtx
          echo "MEDIAMTX_BIN=$RUNNER_TEMP/mediamtx/mediamtx" >> "$GITHUB_ENV"
      - name: Kernel TAI offset (CLOCK_TAI = UTC + 37 s)
        run: sudo scripts/set-tai-offset.py 37
      - name: tests/integration/lifecycle.sh
        run: tests/integration/lifecycle.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/inputs.sh
        run: tests/integration/inputs.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/mix.sh
        run: tests/integration/mix.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/processing.sh
        run: tests/integration/processing.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/room.sh
        run: tests/integration/room.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/vca.sh
        run: tests/integration/vca.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/n1.sh
        run: tests/integration/n1.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/auto.sh (VAD, auto-mix, ducking; espeak-ng speech)
        run: tests/integration/auto.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/show.sh
        run: tests/integration/show.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/ui.sh (headless Chrome)
        run: tests/integration/ui.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
          CHROME: /usr/bin/google-chrome
      - name: tests/integration/tally.sh
        run: tests/integration/tally.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
      - name: tests/integration/widgets.sh (headless Chrome)
        run: tests/integration/widgets.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
          CHROME: /usr/bin/google-chrome
      - name: tests/integration/talkback.sh (talkback, IFB, listen-back; browser WHIP)
        run: tests/integration/talkback.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
          CHROME: /usr/bin/google-chrome
      - name: tests/integration/preview.sh (MediaMTX, WHEP in headless Chrome, latency)
        run: tests/integration/preview.sh
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          IT_OUT: ${{ runner.temp }}/it
          CHROME: /usr/bin/google-chrome
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: nmos-testing ${{ env.NMOS_TESTING_REF }}
        run: |
          mkdir -p "$RUNNER_TEMP/nmos-testing"
          curl -fsSL "https://codeload.github.com/AMWA-TV/nmos-testing/tar.gz/$NMOS_TESTING_REF" |
            tar xz -C "$RUNNER_TEMP/nmos-testing" --strip-components=1
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check -r "$RUNNER_TEMP/nmos-testing/requirements.txt"
      - name: AMWA IS-04-01, IS-05-01, IS-05-02, BCP-007-03-01 against the mixer
        run: ci/amwa.sh off target/release/mxl-audio-mixer
        env:
          LD_LIBRARY_PATH: /opt/mxl/lib
          NMOS_TESTING_DIR: ${{ runner.temp }}/nmos-testing
          NMOS_TESTING_PYTHON: ${{ runner.temp }}/venv/bin/python
          AMWA_OUT: ${{ runner.temp }}/amwa
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/amwa/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration
          path: |
            ${{ runner.temp }}/it
            ${{ runner.temp }}/amwa

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: mxl-audio-mixer:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (uid 1000, libmxl, /livez, the MediaMTX child, SCHED_FIFO with SYS_NICE, exit 143)
        run: |
          set -eu
          [ "$(docker inspect -f '{{.Config.User}}' mxl-audio-mixer:ci)" = 1000 ]
          docker inspect -f '{{json .Config.Labels}}' mxl-audio-mixer:ci
          # Without SYS_NICE the file capability must not stop the exec (78 is the
          # invalid setting, not "operation not permitted").
          rc=0; docker run --rm --cap-drop ALL -e WEB_PORT=abc mxl-audio-mixer:ci || rc=$?
          [ "$rc" = 78 ]
          docker run -d --name smoke --network host -e HOST_ID=smoke -e NMOS_HOST_ADDRESS=192.0.2.10 \
            --cap-drop ALL --cap-add SYS_NICE --security-opt no-new-privileges -e MIXER_RT_PRIORITY=49 \
            -e MXL_DOMAIN_SCAN_PATH=/tmp mxl-audio-mixer:ci
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:8190/livez && break; sleep 0.2; done
          curl -fs http://127.0.0.1:8190/readyz
          curl -fs http://127.0.0.1:8190/ | grep -q 'id="app"'
          curl -fs http://127.0.0.1:8190/widgets | grep -q '"fader-bank"'
          for _ in $(seq 1 50); do curl -fs http://127.0.0.1:8190/api/v1/preview | grep -q '"running":true' && break; sleep 0.2; done
          curl -fs http://127.0.0.1:8190/api/v1/preview | grep -q '"running":true'
          curl -fs http://127.0.0.1:8190/metrics | grep -qx 'mxl_audio_mixer_dsp_realtime 1'
          docker stop -t 15 smoke
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 143 ]
          docker logs smoke 2>&1 | tail -5
